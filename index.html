<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>c.r.y — iki1uc / iki1uc — SCAN NACH INNEN</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#02060a;--gold:#ffd700;--cyan:#00ccff;--lime:#39ff88}
body{margin:0;background:var(--bg);color:#c8f7ff;font:12px Consolas,monospace;padding:14px}
header{border:2px solid var(--gold);border-radius:14px;padding:14px;display:flex;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;color:var(--gold);letter-spacing:4px;font-size:16px}
.badge{border:1px solid #333;padding:2px 8px;border-radius:6px;font-size:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:14px}
.card{background:#0f1520;border:1px solid #1a2c3a;border-radius:10px;padding:12px}
.card b{color:var(--gold)}
button{background:#0a141c;border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<header>
<div>
<h1>◈ c.r.y — SCAN NACH INNEN</h1>
<div style="font-size:10px;color:#6a7a8a;margin-top:4px">repo: iki1uc/iki1uc — index.html — alles neu — scannt nach innen</div>
</div>
<div>
<div class="badge" style="color:var(--cyan);border-color:var(--cyan)">c = core</div>
<div class="badge" style="color:var(--lime);border-color:var(--lime)">r = resonance</div>
<div class="badge" style="color:var(--gold);border-color:var(--gold)">y = yield</div>
</div>
</header>

<div style="margin-top:12px;display:flex;gap:8px">
<button id="scan">▶ SCAN INNEN c.r.y</button>
<span id="status" style="font-size:10px;color:#6a7a8a;padding:8px">bereit</span>
</div>

<div id="grid" class="grid"></div>

<script>
const user='iki1uc', repo='iki1uc';
const $=id=>document.getElementById(id);
function cry(txt,name){
 let t=txt.toLowerCase();
 let c='html', r='81', y=(txt.length/1024).toFixed(0)+'k';
 if(t.includes('pyramide')){c='pyra'; r='81';}
 else if(t.includes('mainboard')||t.includes('nutzraum')){c='main'; r='756';}
 else if(t.includes('axiom')){c='axiom'; r='729';}
 else if(t.includes('mind')||t.includes('kuckuck')){c='mind'; r='243';}
 else if(t.includes('all8all')||t.includes('work')){c='work'; r='369';}
 else if(name.includes('index')){c='root'; r='9';}
 return `${c}.${r}.${y}`;
}
async function scan(){
 $('status').textContent='scanne iki1uc/iki1uc nach innen...';
 $('grid').innerHTML='';
 let api=`https://api.github.com/repos/${user}/${repo}/contents/?per_page=100`;
 let res=await fetch(api); let files=await res.json();
 let htmls=files.filter(f=>f.name.toLowerCase().endsWith('.html'));
 for(let f of htmls){
   let txt=await fetch(f.download_url).then(r=>r.text());
   let title=(txt.match(/<title>(.*?)<\/title>/i)||[])[1]||'—';
   let cryName=cry(txt,f.name);
   let card=document.createElement('div'); card.className='card';
   card.innerHTML=`<div style="display:flex;justify-content:space-between"><b>${f.name}</b><span class="badge" style="color:#ffd700;border-color:#ffd700">${cryName}</span></div>
   <div style="font-size:10px;color:#6a7a8a;margin-top:6px">title: ${title}<br>path: ${f.path}<br>${(txt.length/1024).toFixed(1)} KB<br>c.r.y = ${cryName}</div>
   <div style="margin-top:8px"><a href="${f.download_url}" target="_blank"><button>öffnen</button></a> <button onclick="navigator.clipboard.writeText('${cryName}')">copy c.r.y</button></div>`;
   $('grid').appendChild(card);
 }
 $('status').textContent=`${htmls.length} innen gefunden — benannt c.r.y`;
}
$('scan').onclick=scan;
scan();
</script>
</body>
</html>
